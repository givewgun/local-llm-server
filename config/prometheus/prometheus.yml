global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
