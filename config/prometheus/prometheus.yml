global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]

  # LiteLLM gateway: requests, tokens, failures per key / model.
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
    metrics_path: /metrics/

  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]

  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
