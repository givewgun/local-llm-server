# LiteLLM gateway — the only thing clients ever talk to.
#
# Public model names (what clients put in "model"):
#   local-chat        primary model served by vLLM (whatever MODEL_PRESET is loaded)
#   local-chat-small  small Ollama model; also the automatic fallback for local-chat
#   ollama/<name>     any model pulled into Ollama, e.g. ollama/qwen3:8b
#
# Swapping the vLLM model never changes these names. See docs/operations.md.

model_list:
  - model_name: local-chat
    litellm_params:
      # vLLM always serves under the internal name "primary" (see compose.yaml).
      model: hosted_vllm/primary
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY
      timeout: 600
      stream_timeout: 120
    model_info:
      description: Primary GPU model served by vLLM

  - model_name: local-chat-small
    litellm_params:
      # CPU-only variant (created by `llmctl up`): never competes with vLLM for VRAM.
      model: ollama_chat/llama3.2:3b-cpu
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 600
    model_info:
      description: Small CPU fallback model served by Ollama

  - model_name: ollama/*
    litellm_params:
      model: ollama_chat/*
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 600

litellm_settings:
  drop_params: true
  json_logs: true
  request_timeout: 600
  num_retries: 1
  # Don't persist prompts/completions in the spend log, only metadata.
  turn_off_message_logging: true
  # Expand the ollama/* wildcard in /v1/models to what Ollama actually has pulled.
  check_provider_endpoint: true
  # Per-key / per-model request, token and failure metrics on /metrics.
  # Unauthenticated is fine: :4000 is loopback/tailnet only and the tunnel never routes /metrics.
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false

router_settings:
  routing_strategy: simple-shuffle
  # If vLLM is down (e.g. GPU busy, model swap in progress) fall back to Ollama.
  fallbacks:
    - local-chat: ["local-chat-small"]
  allowed_fails: 3
  cooldown_time: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keep the DB-backed key/spend system healthy if Postgres blips.
  allow_requests_on_db_unavailable: true
  # Hard ceilings any generated key is clamped to.
  upperbound_key_generate_params:
    rpm_limit: 600
    tpm_limit: 500000
    max_parallel_requests: 16
  # Applied when `/key/generate` is called without explicit limits.
  default_key_generate_params:
    rpm_limit: 60
    tpm_limit: 100000
    max_parallel_requests: 4
