openapi: 3.1.0
info:
  title: Local LLM Server API
  version: "1.0"
  description: |
    OpenAI-compatible API served from a self-hosted GPU (vLLM behind a LiteLLM gateway).

    **Auth:** click **Authorize** and paste your API key (`sk-...`) — no `Bearer ` prefix.
    Keys are issued by the operator; this page never stores them server-side.

    **Models**
    - `local-chat` — primary GPU model (Qwen3-8B AWQ, 16k context). Falls back to `local-chat-small` when the GPU engine is down.
    - `local-chat-small` — Llama 3.2 3B on CPU. Slower, lower quality.
    - `ollama/<name>` — extra Ollama models, if your key allows them.

    Any OpenAI SDK works: set `base_url` to `<this host>/v1`.
    Use `"stream": true` for long outputs (non-streamed requests are cut after ~100 s).
servers:
  - url: /
    description: This host
security:
  - bearerAuth: []
tags:
  - name: Chat
  - name: Completions
  - name: Models
  - name: Health

paths:
  /v1/chat/completions:
    post:
      tags: [Chat]
      summary: Create a chat completion
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatCompletionRequest"}
            examples:
              simple:
                summary: Simple question
                value:
                  model: local-chat
                  messages:
                    - {role: system, content: You are a concise assistant.}
                    - {role: user, content: Explain retrieval-augmented generation in two sentences.}
                  max_tokens: 200
              thinking:
                summary: Reasoning (thinking) mode
                value:
                  model: local-chat
                  messages:
                    - {role: user, content: "A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much is the ball?"}
                  chat_template_kwargs: {enable_thinking: true}
                  max_tokens: 1024
              json:
                summary: JSON output
                value:
                  model: local-chat
                  messages:
                    - {role: user, content: "Give me three fruits with their colours as JSON: {\"fruits\": [{\"name\": ..., \"colour\": ...}]}"}
                  response_format: {type: json_object}
              tools:
                summary: Tool calling
                value:
                  model: local-chat
                  messages:
                    - {role: user, content: "What's the weather in Bangkok?"}
                  tools:
                    - type: function
                      function:
                        name: get_weather
                        description: Get current weather for a city
                        parameters:
                          type: object
                          properties:
                            city: {type: string}
                          required: [city]
                  tool_choice: auto
      responses:
        "200":
          description: "Completion. With `stream=true` the body is `text/event-stream` of chunk objects ending in `data: [DONE]`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatCompletionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/completions:
    post:
      tags: [Completions]
      summary: Create a text completion (legacy, raw prompt)
      operationId: createCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompletionRequest"}
            example:
              model: local-chat
              prompt: "The three primary colours are"
              max_tokens: 32
              temperature: 0
      responses:
        "200":
          description: Completion
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompletionResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/models:
    get:
      tags: [Models]
      summary: List models your key can use
      operationId: listModels
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: {type: string, example: list}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, example: local-chat}
                        object: {type: string, example: model}
                        owned_by: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /health/liveliness:
    get:
      tags: [Health]
      summary: Gateway liveness (no auth)
      operationId: liveness
      security: []
      responses:
        "200":
          description: Gateway is up
          content:
            application/json:
              schema: {type: string, example: I'm alive!}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your API key (sk-...)

  responses:
    BadRequest:
      description: Invalid request (unknown model, context too long, bad parameters)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid API key, or model not allowed for this key
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Key exceeded its requests/min, tokens/min or concurrency limit — back off and retry
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Message:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [system, user, assistant, tool]}
        content:
          type: [string, "null"]
        tool_calls:
          type: array
          items: {$ref: "#/components/schemas/ToolCall"}
        tool_call_id:
          type: string
          description: Required when role is `tool`

    ToolCall:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [function]}
        function:
          type: object
          properties:
            name: {type: string}
            arguments: {type: string, description: JSON-encoded arguments}

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string, example: local-chat}
        messages:
          type: array
          items: {$ref: "#/components/schemas/Message"}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, minimum: 0, maximum: 1}
        stop:
          oneOf:
            - {type: string}
            - {type: array, items: {type: string}}
        stream: {type: boolean, default: false}
        seed: {type: integer}
        response_format:
          type: object
          description: "`{\"type\": \"json_object\"}` or `{\"type\": \"json_schema\", \"json_schema\": {...}}`"
        tools:
          type: array
          items: {type: object}
        tool_choice:
          oneOf:
            - {type: string, enum: [none, auto, required]}
            - {type: object}
        chat_template_kwargs:
          type: object
          description: >-
            Model-specific template switches. `{"enable_thinking": true}` turns on Qwen3
            reasoning; output then includes `reasoning_content`.

    ChatCompletionResponse:
      type: object
      properties:
        id: {type: string}
        object: {type: string, example: chat.completion}
        created: {type: integer}
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              finish_reason: {type: string, enum: [stop, length, tool_calls]}
              message:
                allOf:
                  - {$ref: "#/components/schemas/Message"}
                  - type: object
                    properties:
                      reasoning_content:
                        type: [string, "null"]
                        description: Present when thinking mode is on
        usage: {$ref: "#/components/schemas/Usage"}

    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model: {type: string, example: local-chat}
        prompt:
          oneOf:
            - {type: string}
            - {type: array, items: {type: string}}
        max_tokens: {type: integer}
        temperature: {type: number}
        stop:
          oneOf:
            - {type: string}
            - {type: array, items: {type: string}}
        stream: {type: boolean, default: false}

    CompletionResponse:
      type: object
      properties:
        id: {type: string}
        object: {type: string, example: text_completion}
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              text: {type: string}
              finish_reason: {type: string}
        usage: {$ref: "#/components/schemas/Usage"}

    Usage:
      type: object
      properties:
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: {type: string}
            type: {type: string}
            code: {type: [string, "null"]}
